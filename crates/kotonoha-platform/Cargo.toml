[package]
name = "kotonoha-platform"
description = "OS adapters for Kotonoha: audio capture, whisper.cpp / llama.cpp processes, clipboard and paste, storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
kotonoha-core.workspace = true
arboard = "3"
async-trait.workspace = true
cpal = "0.18"
directories = "6"
enigo = "0.6"
hound = "3"
rubato = "5"
serde.workspace = true
sha2 = "0.11"
serde_json.workspace = true
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tempfile = "3"
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "time", "io-util", "rt", "sync", "macros"] }
tracing.workspace = true
ureq = "3"
which = "8"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
core-foundation = "0.10"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["process", "time", "io-util", "rt", "rt-multi-thread", "sync", "macros"] }

[lints]
workspace = true
